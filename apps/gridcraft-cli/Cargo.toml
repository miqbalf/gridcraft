[package]
name = "gridcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft command line: inspect, convert, evaluate, script and serve MCP without a window"
publish = false

[lints]
workspace = true

[[bin]]
name = "gridcraft-cli"
path = "src/main.rs"

[dependencies]
gridcraft-sandbox = { workspace = true }
gridcraft-engine = { workspace = true }
gridcraft-mcp = { workspace = true }
gridcraft-live = { workspace = true }
gridcraft-core = { workspace = true }
gridcraft-model = { workspace = true }
# Live co-editing (collab-craft, miqbalf fork), all from one revision: departs from AGENTS.md
# rule 10 by owner decision. `live-worker` is the document service behind the Nextcloud app.
craft-live-worker = { workspace = true }
craft-live = { workspace = true }
craft-collab = { workspace = true, features = ["native-hub"] }
serde_json = { workspace = true }
log = { workspace = true }
# `check`: validating the packages GridCraft writes (content types, relationships).
zip = { workspace = true }
quick-xml = { workspace = true }

[dev-dependencies]
gridcraft-live = { workspace = true, features = ["test-util"] }
craft-live = { workspace = true, features = ["test-util"] }
