[package]
name = "gridcraft-live"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft live co-editing: the yrs schema, layout, mapping, gate, undo and presence over craft-live"

[lints]
workspace = true

[features]
# An in-memory relay so tests can join a real session with no server (dev use only).
test-util = ["craft-live/test-util"]
# The native socket hub, for the relay tests.
native-hub = ["craft-collab/native-hub", "dep:tokio"]

[dependencies]
gridcraft-core = { workspace = true }
gridcraft-formula = { workspace = true }
gridcraft-model = { workspace = true }
gridcraft-calc = { workspace = true }
gridcraft-engine = { workspace = true }
gridcraft-xlsx = { workspace = true }
# From miqbalf/collab-craft, departing from AGENTS.md rule 10 by owner decision.
craft-collab = { workspace = true }
craft-live = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
# Reading a ticket's claims (`ticket`).
base64 = { workspace = true }
# The desktop link's background connect (`native_link`, feature `native-hub`).
tokio = { version = "1", features = ["rt", "time", "sync", "macros"], optional = true }

[dev-dependencies]
# The relay tests (feature `native-hub`): mint relay tickets (HMAC-SHA256 over the base64url
# payload) and drive the native hub.
hmac = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
